[pytest]
testpaths = tests
markers =
    slow: expensive high-precision mpmath checks (zero-finding, warp evaluation,
        migration tracking; up to a few minutes). Deselected by default; run
        with `pytest -m slow`.
# Keep the default suite fast: the slow regressions are deselected unless
# `-m slow` is passed (which overrides this default marker expression).
addopts = -m "not slow"
